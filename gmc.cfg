[sound_system]

music={
"type": "solo"
}
effects={
"default": true,
"simultaneous_sounds": 3,
"type": "simultaneous"
}
voice={
"type": "sequential"
}

[mpf]

executable_path="/path/to/python OR executable OR binary"
executable_args="-m mpf (when using python)"
mpf_args="MPF options like -a or -P"
virtual=true
verbose=true
spawn_mpf=true

#config_version=6

keyboard:
  s:
    switch: s_start
  c:
    switch: s_cap1

modes:
  - base

flippers:
  lower_left:
    main_coil:
    hold_coil:
    activation_switch:
  lower_right:
    main_coil:
    hold_coil:
    activation_switch:
      
ball_devices:
  bd_trough:
    ball_switches: s_trough1, s_trough2, s_trough3, s_trough4, s_trough5, s_trough6, s_trough_jam,
    eject_coil: c_trough_eject
    tags: trough, home, drain
    jam_switch: s_trough_jam
    eject_coil_jam_pulse: 15ms
    eject_targets: bd_plunger
    eject_timeouts: 3s
  bd_plunger:
    ball_switches: s_plunger
    mechanical_eject: true
    eject_timeouts: 5s
  bd_scoop:
    ball_switches: c_scoop
    eject_coil: c_scoop
    mechanical_eject: true
    eject_timeouts: 1s
  bd_lock:
    ball_switches: s_lock1, s_lock2, s_lock3
    eject_coil: c_lock
    eject_all_events:
#   eject_timeouts: 1s
  bd_lock2:
    ball_switches: d_lock4, d_lock5, d_lock6
    eject_coil: d_lock
    eject_all_events:
#   eject_timeouts: 1s

